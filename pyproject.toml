[project]
name = "pylisc"
version = "2.3.0"
description = "Python implementation of LisC algorithm"
readme = "README.md"
authors = [
    { name = "Sam Holland", email = "hol_sam@icloud.com" }
]
requires-python = ">=3.14"
dependencies = [
    "loguru>=0.7.3",
    "matplotlib>=3.11.0",
    "mrcfile>=1.5.4",
    "numpy>=2.5.1",
    "rich>=15.0.0",
    "scipy>=1.18.0",
    "tifffile>=2026.7.14",
    "typer>=0.27.0",
]

[project.scripts]
pylisc = "pylisc.cli:pylisc"

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]
